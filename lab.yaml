apiVersion: v1
kind: ConfigMap
metadata:
  name: sky-app-code
data:
  app.py: |
    from flask import Flask
    import socket
    app = Flask(__name__)
    @app.route('/')
    def home():
        db_online = False
        try:
            # App looks for 'db-service'
            socket.create_connection(("db-service", 5432), timeout=1)
            db_online = True
        except: pass
        color = "#2ecc71" if db_online else "#e74c3c"
        return f"""
        <body style='text-align:center; background:#f0f2f5; font-family:sans-serif; padding-top:50px;'>
            <div style='background:white; display:inline-block; padding:40px; border-radius:10px; border-top:10px solid {color};'>
                <h1 style='color:#2c3e50;'>CodeKerdos SKY Lab</h1>
                <h2 style='color:{color};'>Database: {'ONLINE' if db_online else 'OFFLINE'}</h2>
                <form action='/stress' method='post'>
                    <button style='padding:10px 20px; cursor:pointer;'>Simulate Traffic Spike</button>
                </form>
            </div>
        </body>
        """
    @app.route('/stress', methods=['POST'])
    def stress():
        l = [i for i in range(10**6)]
        return "Processing..."
    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5000)
---
apiVersion: v1
kind: Service
metadata:
  name: sky-frontend-svc
spec:
  selector:
    app: sky-front-end # FIX 1: Change to 'sky-frontend'
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: codekerdos-premium # FIX 2: Change to 'standard'
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: sky-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sky-frontend
  template:
    metadata:
      labels:
        app: sky-frontend
    spec:
      containers:
      - name: sky-container
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args: ["pip install flask && python /app/app.py"]
        resources:
          limits:
            memory: "64Mi" # FIX 3: Change to '256Mi'
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: sky-app-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sky-db
  template:
    metadata:
      labels:
        app: sky-db
    spec:
      containers:
      - name: postgres
        image: postgres:13-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "pass"
        volumeMounts:
        - name: storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: db-pvc