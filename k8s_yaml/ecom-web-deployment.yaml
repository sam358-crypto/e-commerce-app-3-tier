apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-web
  namespace: ecom
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ecom-web
  template:
    metadata:
      labels:
        app: ecom-web
    spec:
      containers:
        - name: ecom-web
          image: sam3583558/ecom-web:v1.0
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: ecom-db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecom-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ecom-db-secret
                  key: DB_NAME
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"